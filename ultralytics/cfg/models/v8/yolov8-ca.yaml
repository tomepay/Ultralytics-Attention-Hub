# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, CoordAtt, [1024]]   # 9 <--- 插入这里，索引变为 9
  - [-1, 1, SPPF, [1024, 5]]  # 10 <--- 原本的 9 顺延变为 10

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (原10)
  - [[-1, 6], 1, Concat, [1]] # 12 (原11) 这里的 6 不变，因为 6 在插入点 9 之前
  - [-1, 3, C2f, [512]] # 13 (原12)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (原13)
  - [[-1, 4], 1, Concat, [1]] # 15 (原14) 这里的 4 不变
  - [-1, 3, C2f, [256]] # 16 (原15) P3输出

  - [-1, 1, Conv, [256, 3, 2]] # 17 (原16)
  - [[-1, 13], 1, Concat, [1]] # 18 (原17) 这里的 13 对应上面的层
  - [-1, 3, C2f, [512]] # 19 (原18) P4输出

  - [-1, 1, Conv, [512, 3, 2]] # 20 (原19)
  - [[-1, 10], 1, Concat, [1]] # 21 (原20) ★重点：原本是 [-1, 9]，现在改为 10，因为 SPPF 变成了 10
  - [-1, 3, C2f, [1024]] # 22 (原21) P5输出

  - [[16, 19, 22], 1, Detect, [nc]] # 23 (原22) ★重点：原本是 [15, 18, 21]，现在全部 +1